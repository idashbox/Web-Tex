version: '3.1'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - mongo-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    networks:
      - mongo-network
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: 1234567
      ME_CONFIG_MONGODB_URL: mongodb://root:1234567@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

networks:
  mongo-network:
    driver: bridge
