spring:
  application:
    name: demo3

  data:
    mongodb:
      uri: mongodb://localhost:27017/webtex
      username: root
      password: 1234567
      database: webtex

  datasource:
    url: jdbc:postgresql://localhost:5432/webtex
    username: postgres
    password: 1234567
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-request-size: 20MB

  logging:
    level:
      root: INFO

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
